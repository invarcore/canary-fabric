services:
  test-suite:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: canary-fabric-test-suite
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uv", "run", "pytest", "--cov=canary_fabric", "--cov-report=term-missing", "--cov-fail-under=90"]

  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: canary-fabric-smoke-test
    depends_on:
      - test-suite
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uv", "run", "python", "benchmarks/live_watermark_smoke_test.py"]
