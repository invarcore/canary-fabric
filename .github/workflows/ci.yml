name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests with pytest and coverage enforcement (>=90%)
        run: uv run pytest -v --cov=canary_fabric --cov-report=term-missing --cov-fail-under=90

      - name: Run live functional smoke test
        run: uv run python benchmarks/live_watermark_smoke_test.py

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hermetic Docker Compose Test
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from smoke-test